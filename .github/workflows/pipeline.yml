# ============================================================
# CI/CD-pipeline med säkerhetssteg – Lektion 8 Demo
# ============================================================
# Triggas automatiskt vid push eller pull request mot main

name: Säker CI/CD-pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:

  # ──────────────────────────────────────────
  # STEG 1: Bygg och kör enhetstester
  # ──────────────────────────────────────────
  build-and-test:
    name: "1. Build & Test"
    runs-on: ubuntu-latest

    steps:
      - name: Hämta koden från GitHub
        uses: actions/checkout@v4

      - name: Sätt upp Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Installera beroenden
        run: npm ci

      - name: Kör enhetstester
        run: npm test

  # ──────────────────────────────────────────
  # STEG 2A: SAST – Statisk kodanalys
  # Analyserar källkoden utan att köra appen
  # Hittar t.ex. eval(), SQL injection, XSS
  # ──────────────────────────────────────────
  sast:
    name: "2a. SAST – Kodanalys (CodeQL)"
    runs-on: ubuntu-latest
    needs: build-and-test

    permissions:
      security-events: write
      contents: read

    steps:
      - name: Hämta koden
        uses: actions/checkout@v4

      - name: Initiera CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript
          # "security-extended" hittar fler sårbarheter än standard
          queries: security-extended

      - name: Kör CodeQL-analys
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript"

  # ──────────────────────────────────────────
  # STEG 2B: SCA – Kontrollera beroenden
  # Kollar om npm-paket har kända CVE-sårbarheter
  # ──────────────────────────────────────────
  sca:
    name: "2b. SCA – Beroendeanalys (npm audit)"
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Hämta koden
        uses: actions/checkout@v4

      - name: Sätt upp Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Installera beroenden
        run: npm ci

      - name: Kör npm audit
        # --audit-level=high → bryter bygget om "high" eller "critical" CVE hittas
        run: npm audit --audit-level=high

      - name: Kör Snyk SCA (valfritt – kräver SNYK_TOKEN secret)
        # Avkommentera om du satt upp Snyk
        # uses: snyk/actions/node@master
        # env:
        #   SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        # with:
        #   args: --severity-threshold=high
        run: echo "Snyk är avkommenterat i demo-läge"

  # ──────────────────────────────────────────
  # STEG 3: Bygg Docker-image och scanna den
  # Trivy letar efter sårbara OS-paket i imagen
  # ──────────────────────────────────────────
  container-scan:
    name: "3. Container scanning (Trivy)"
    runs-on: ubuntu-latest
    needs: [sast, sca]

    steps:
      - name: Hämta koden
        uses: actions/checkout@v4

      - name: Bygg Docker-image
        run: docker build -t demo-app:${{ github.sha }} .

      - name: Scanna imagen med Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'demo-app:${{ github.sha }}'
          format: 'sarif'
          output: 'trivy-results.sarif'
          # Bryt bygget om CRITICAL eller HIGH hittas
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      - name: Ladda upp Trivy-resultat till GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()   # Ladda upp även om steget misslyckades
        with:
          sarif_file: 'trivy-results.sarif'

  # ──────────────────────────────────────────
  # STEG 4: Deploy (simulerad)
  # Körs BARA om alla säkerhetssteg är gröna
  # ──────────────────────────────────────────
  deploy:
    name: "4. Deploy till testmiljö"
    runs-on: ubuntu-latest
    needs: container-scan   # ← Kräver att container-scan passerat

    steps:
      - name: Simulerad deploy
        run: |
          echo "✅ Alla säkerhetskontroller passerade!"
          echo "🚀 Driftsätter version ${{ github.sha }} till testmiljö..."
          echo "   (I en riktig pipeline skulle detta pusha till Railway, AWS, m.m.)"
